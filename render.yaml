services:
  - type: web
    name: spotify-review-insights
    runtime: python
    plan: free
    buildCommand: pip install -r dashboard/requirements.txt
    startCommand: uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard to the Neon Postgres connection string
